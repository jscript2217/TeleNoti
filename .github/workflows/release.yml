name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v2.5.0)'
        required: true
        default: 'v2.5.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tag name: $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Build APKs and prepare release assets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/release-keystore.jks"
          LOG_FILE="${GITHUB_WORKSPACE}/release-build.log"
          cleanup() {
            rm -f "$KEYSTORE_FILE" "$LOG_FILE"
          }
          trap cleanup EXIT

          run_gradle_with_log() {
            local rc=0
            local summary_block=""
            local single_line=""
            set +e
            ./gradlew "$@" --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" 2>&1 | tee "$LOG_FILE"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              summary_block="$(grep -B 3 -A 15 -F -e '* What went wrong:' -e 'FAILURE:' "$LOG_FILE" | head -n 60 || true)"
              if [ -z "$summary_block" ]; then
                summary_block="$(tail -n 50 "$LOG_FILE" || true)"
              fi
              {
                echo "### Gradle release build failed (exit $rc)"
                echo '```text'
                printf '%s\n' "$summary_block"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              single_line="$(printf '%s' "$summary_block" | tr '[:space:]' ' ' | sed 's/  */ /g' | cut -c1-400)"
              echo "::error title=Gradle release build failed::$single_line"
              exit "$rc"
            fi
          }

          mkdir -p dist
          rm -f dist/*

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected: building signed release APK."
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_FILE"; then
              echo "::error title=Keystore decode failed::Failed to base64-decode KEYSTORE_BASE64."
              exit 1
            fi
            KEYSTORE_BYTES=$(wc -c < "$KEYSTORE_FILE")
            echo "Decoded keystore size: ${KEYSTORE_BYTES} bytes"
            if [ "$KEYSTORE_BYTES" -le 0 ]; then
              echo "::error title=Invalid keystore::Decoded keystore file is empty."
              exit 1
            fi
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"

            run_gradle_with_log assembleRelease
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            if [ ! -f "$APK_SRC" ]; then
              echo "::error title=Missing signed APK::Expected $APK_SRC was not generated."
              exit 1
            fi
            cp "$APK_SRC" "dist/TeleNoti-${RELEASE_TAG}.apk"
          else
            echo "Signing secrets not configured: building debug and unsigned release APKs."
            run_gradle_with_log assembleDebug assembleRelease
            DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$DEBUG_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
              echo "::error title=Missing APKs::Expected debug or unsigned release APK was not generated."
              exit 1
            fi
            cp "$DEBUG_APK" "dist/TeleNoti-${RELEASE_TAG}-debug.apk"
            cp "$UNSIGNED_APK" "dist/TeleNoti-${RELEASE_TAG}-release-unsigned.apk"
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Clean up decoded keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/release-keystore.jks" "${{ github.workspace }}/release-build.log"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TeleNoti ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*
