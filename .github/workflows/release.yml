name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v2.3.0)'
        required: true
        default: 'v2.3.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tag name: $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs and prepare release assets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/release-keystore.jks"
          cleanup() {
            rm -f "$KEYSTORE_FILE"
          }
          trap cleanup EXIT

          mkdir -p dist
          rm -f dist/*

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected: building signed release APK."
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"

            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "dist/TeleNoti-${RELEASE_TAG}.apk"
          else
            echo "Signing secrets not configured: building debug and unsigned release APKs."
            ./gradlew assembleDebug assembleRelease --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "dist/TeleNoti-${RELEASE_TAG}-debug.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/TeleNoti-${RELEASE_TAG}-release-unsigned.apk"
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Clean up decoded keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TeleNoti ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*
